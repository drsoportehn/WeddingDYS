# Evita que el proyecto gratuito de Supabase se pause por inactividad (7 días).
# Requiere los secretos SUPABASE_URL y SUPABASE_ANON_KEY en
# Settings > Secrets and variables > Actions.
name: Mantener Supabase activo
on:
  schedule:
    - cron: "0 15 * * 1,4"   # lunes y jueves, 9:00 a. m. Honduras
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/settings?select=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
          echo "Supabase respondió correctamente"
